{% extends 'core/base.html' %}
{% block title %}Eliminar categoría | La Caja de Pandora{% endblock title %}
{% block contenido %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-7 col-lg-5">
                <section class="card border-0 shadow-sm rounded-4 p-4 p-md-5 text-center">
                    <span class="menu-icon mx-auto mb-3 text-danger"><i class="bi bi-trash3"></i></span>
                    <h1 class="h3">Eliminar categoría</h1>
                    <p class="text-muted">¿Seguro que quieres eliminar <strong>{{ categoria }}</strong>?</p>
                    <form method="post" class="d-flex justify-content-center gap-2">
                        {% csrf_token %}<button class="btn btn-danger" type="submit">Sí, eliminar</button>
                        <a class="btn btn-outline-secondary"
                           href="{% url 'producto:categoria_list' %}">Cancelar</a>
                    </form>
                </section>
            </div>
        </div>
    </div>
{% endblock contenido %}
