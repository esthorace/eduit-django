{% extends 'core/base.html' %}
{% block title %}{{ categoria.nombre }} | La Caja de Pandora{% endblock title %}
{% block contenido %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <section class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                    <div class="d-flex justify-content-between gap-3 mb-4">
                        <div>
                            <span class="menu-icon mb-3"><i class="bi bi-tag"></i></span>
                            <h1 class="h3 mb-0">{{ categoria.nombre }}</h1>
                        </div>
                        <a class="btn btn-outline-primary align-self-start"
                           href="{% url 'producto:categoria_update' categoria.id %}"><i class="bi bi-pencil me-2"></i>Editar</a>
                    </div>
                    <dl class="detail-list mb-0">
                        <dt>Descripción</dt>
                        <dd>
                            {{ categoria.descripcion|default:'Sin descripción' }}
                        </dd>
                    </dl>
                </section>
                <a class="btn btn-link px-0 mt-3"
                   href="{% url 'producto:categoria_list' %}"><i class="bi bi-arrow-left me-2"></i>Volver a categorías</a>
            </div>
        </div>
    </div>
{% endblock contenido %}
